name: Build Control
on:
  push:
    branches: ["main"]
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload to (leave empty to skip release)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: read
  packages: none
  pages: write
  id-token: write


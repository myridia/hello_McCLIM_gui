name: Linux
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write
  pull-requests: write
  issues: read
  packages: none

jobs:
  Build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install
        run: |
          sudo apt-get update -y
          sudo apt-get install -y sbcl curl
          curl -fsSL https://beta.quicklisp.org/quicklisp.lisp -o /tmp/quicklisp.lisp
          sbcl --non-interactive \
            --load /tmp/quicklisp.lisp \
            --eval '(quicklisp-quickstart:install)' \
            --eval '(sb-ext:exit)'
          if ! grep -q 'quicklisp/setup.lisp' "$HOME/.sbclrc" 2>/dev/null; then
            printf '%s\n' \
              ';;; The following lines added by ql:add-to-init-file:' \
              '#-quicklisp' \
              '(let ((quicklisp-init (merge-pathnames "quicklisp/setup.lisp"' \
              '                                       (user-homedir-pathname))))' \
              '  (when (probe-file quicklisp-init)' \
              '    (load quicklisp-init)))' >> "$HOME/.sbclrc"
          fi
          sbcl --non-interactive \
            --load "$HOME/quicklisp/setup.lisp" \
            --eval '(ql:quickload :mcclim)' \
            --eval '(sb-ext:exit)'
          sbcl --version

      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile
        run: |
          ./ask.d/build.sh

      - name: Smoke test
        run: |
          ./dist/mcclim/mcclim -nw

      - name: Rename
        run: |
          cp dist/mcclim/mcclim dist/mcclim/mcclim_linux

      - name: Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: 'dist/mcclim/mcclim_linux'
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true

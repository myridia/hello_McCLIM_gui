name: Linux
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write
  pull-requests: write
  issues: read
  packages: none

jobs:
  Build:
    runs-on: ubuntu-latest

    steps:
      - name: Requirements
        run: |
          echo "Requirements"
          sudo apt-get update -y
          sudo apt-get install -y sbcl curl tree
          curl -fsSL https://beta.quicklisp.org/quicklisp.lisp -o /tmp/quicklisp.lisp
          sbcl --version

          
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile
        run: |
          echo "Compile"
          rm -rf bin dist/mcclim && mkdir -p bin dist/mcclim
          sbcl --non-interactive \
            --load /tmp/quicklisp.lisp \
            --eval '(quicklisp-quickstart:install)' \
            --eval '(sb-ext:exit)'
          sbcl --non-interactive \
            --eval '(defparameter cl-user::*auto-start* nil)' \
            --load main.lisp \
            --eval '(sb-ext:save-lisp-and-die "bin/mcclim" :toplevel (function clim-user:main) :executable t :compression t)'
          find . -maxdepth 2
          exe=bin/mcclim; [ -e "$exe.exe" ] && exe="$exe.exe"; cp "$exe" "dist/mcclim/${exe##*/}"
          ttf=$(find "$HOME/quicklisp/dists/quicklisp/software" -path '*/dejavu-fonts-ttf-*/ttf/DejaVuSans.ttf' -print -quit)
          cp "$ttf" dist/mcclim/DejaVuSans.ttf

      - name: Test
        run: |
          echo "Test"          
          ./dist/mcclim/mcclim -nw

      - name: Rename
        run: |
          cp dist/mcclim/mcclim dist/mcclim/mcclim_linux
          cd dist/mcclim && zip mcclim_linux.zip mcclim_linux DejaVuSans.ttf

      - name: Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: 'dist/mcclim/mcclim_linux.zip'
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true

name: Debian
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write
  pull-requests: write
  issues: read
  packages: none

jobs:
  Build:
    runs-on: ubuntu-22.04

    steps:
      - name: Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y sbcl curl debhelper fakeroot build-essential tree
          curl -fsSL https://beta.quicklisp.org/quicklisp.lisp -o /tmp/quicklisp.lisp
          sbcl --version

      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile
        run: |
          echo "Compile"
          rm -rf bin dist/mcclim && mkdir -p bin dist/mcclim
          sbcl --non-interactive \
            --load /tmp/quicklisp.lisp \
            --eval '(quicklisp-quickstart:install)' \
            --eval '(sb-ext:exit)'
          sbcl --non-interactive \
            --eval '(defparameter cl-user::*auto-start* nil)' \
            --load main.lisp \
            --eval '(defparameter cl-user::*bundled-font-bytes* (with-open-file (s (cl-dejavu:font-pathname "DejaVuSans.ttf") :element-type (quote (unsigned-byte 8))) (let* ((n (file-length s)) (b (make-array n :element-type (quote (unsigned-byte 8))))) (read-sequence b s) b)))' \
            --eval '(sb-ext:save-lisp-and-die "bin/mcclim" :toplevel (function clim-user:main) :executable t :compression t)'
          exe=bin/mcclim; [ -e "$exe.exe" ] && exe="$exe.exe"; cp "$exe" "dist/mcclim/${exe##*/}"

      - name: Package
        run: |
          cp dist/mcclim/mcclim make_deb/src/mcclim
          ls -l make_deb/src/mcclim
          cd make_deb/src
          dpkg-buildpackage -us -uc -b
          cd ../../
          deb=make_deb/mcclim_0.1.0-1_amd64.deb
          dpkg-deb -c "$deb"
          dpkg-deb -x "$deb" /tmp/mcclim-deb-check
          ls -lh /tmp/mcclim-deb-check/usr/bin/mcclim
          size=$(stat -c%s /tmp/mcclim-deb-check/usr/bin/mcclim)
          if [ "$size" -lt 10000000 ]; then
            echo "ERROR: packaged mcclim is only $size bytes (SBCL core was stripped)"
            exit 1
          fi
          tree make_deb

      - name: Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: 'make_deb/mcclim_0.1.0-1_amd64.deb'
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true

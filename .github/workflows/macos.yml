name: Macos
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (leave empty to skip release)'
        required: false
        type: string
  workflow_call:
    inputs:
      tag:
        description: 'Release tag from caller (leave empty to use pushed tag)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: read
  packages: none

jobs:
  Build:
    runs-on: macos-latest

    steps:
      - name: Install
        run: |
          brew install sbcl curl
          curl -fsSL https://beta.quicklisp.org/quicklisp.lisp -o /tmp/quicklisp.lisp
          sbcl --version

      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile
        run: |
          echo "Compile"
          rm -rf bin dist/mcclim && mkdir -p bin dist/mcclim
          sbcl --non-interactive \
            --load /tmp/quicklisp.lisp \
            --eval '(quicklisp-quickstart:install)' \
            --eval '(sb-ext:exit)'
          sbcl --non-interactive \
            --eval '(defparameter cl-user::*auto-start* nil)' \
            --load main.lisp \
            --eval '(defparameter cl-user::*bundled-font-bytes* (with-open-file (s (cl-dejavu:font-pathname "DejaVuSans.ttf") :element-type (quote (unsigned-byte 8))) (let* ((n (file-length s)) (b (make-array n :element-type (quote (unsigned-byte 8))))) (read-sequence b s) b)))' \
            --eval '(sb-ext:save-lisp-and-die "bin/mcclim" :toplevel (function clim-user:main) :executable t :compression t)'
          exe=bin/mcclim; [ -e "$exe.exe" ] && exe="$exe.exe"; cp "$exe" "dist/mcclim/${exe##*/}"

      - name: Rename
        run: |
          cp dist/mcclim/mcclim dist/mcclim/mcclim_macos

      - name: Ad-hoc sign
        run: |
          codesign --force --sign - --identifier com.myridia.mcclim.macos --timestamp=none dist/mcclim/mcclim_macos
          codesign --verify --verbose=2 dist/mcclim/mcclim_macos

      - name: Package DMG
        run: |
          rm -rf mcclim_macos.app
          mkdir -p mcclim_macos.app/Contents/MacOS
          cp dist/mcclim/mcclim_macos mcclim_macos.app/Contents/MacOS/mcclim
          cat > mcclim_macos.app/Contents/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>McCLIM</string>
            <key>CFBundleDisplayName</key>
            <string>McCLIM</string>
            <key>CFBundleIdentifier</key>
            <string>com.myridia.mcclim</string>
            <key>CFBundleExecutable</key>
            <string>mcclim</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>0.1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF
          chmod +x mcclim_macos.app/Contents/MacOS/mcclim
          codesign --force --sign - --identifier com.myridia.mcclim.executable --timestamp=none mcclim_macos.app/Contents/MacOS/mcclim
          codesign --force --sign - --identifier com.myridia.mcclim --timestamp=none mcclim_macos.app
          codesign --verify --deep --verbose=2 mcclim_macos.app
          hdiutil create -volname "mcclim_macos" -srcfolder "mcclim_macos.app" -ov -format UDZO "dist/mcclim/mcclim_macos.dmg"
          codesign --force --sign - --timestamp=none dist/mcclim/mcclim_macos.dmg
          codesign --verify --verbose=2 dist/mcclim/mcclim_macos.dmg
          hdiutil verify dist/mcclim/mcclim_macos.dmg

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="$INPUT_TAG"
          if [ -z "$tag" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          fi
          if [ -z "$tag" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "No release tag (not a tag push and no tag input); skipping release"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

      - name: Release
        if: steps.release.outputs.publish == 'true'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: 'dist/mcclim/{mcclim_macos,mcclim_macos.dmg}'
          tag: ${{ steps.release.outputs.tag }}
          overwrite: true
          file_glob: true
